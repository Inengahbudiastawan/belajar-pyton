<!DOCTYPE html>
<html>
<head>
    <title>Belajar Python</title>
</head>
<body>

    <h1>Belajar Python</h1>

    <form method="POST">
        <label>Siapa nama Anda?</label>
        <br><br>

        <input type="text" name="nama" required>

        <button type="submit">Kirim</button>
    </form>

    {% if nama %}
        <h2>Halo {{ nama }}!</h2>
        <p>Selamat belajar Python!</p>
    {% endif %}

</body>
</html>
