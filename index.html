<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live AI Customer Service</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  overflow: hidden;
}


/* ==================================================
   BACKGROUND
================================================== */

body {

  background:
    radial-gradient(
      circle at 20% 20%,
      #2563eb 0,
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #020617,
      #0f172a
    );

  color: white;

}


/* ==================================================
   APP
================================================== */

.app {

  width: 100%;
  height: 100vh;

  display: flex;
  flex-direction: column;

}


/* ==================================================
   HEADER
================================================== */

.header {

  height: 70px;

  padding: 0 30px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  background:
    rgba(2,6,23,.85);

  border-bottom:
    1px solid rgba(255,255,255,.1);

  z-index: 10;

}

.logo {

  font-size: 21px;

  font-weight: bold;

}

.status-online {

  display: flex;

  align-items: center;

  gap: 8px;

  font-size: 13px;

  color: #cbd5e1;

}

.online-dot {

  width: 9px;

  height: 9px;

  border-radius: 50%;

  background: #22c55e;

  box-shadow:
    0 0 12px #22c55e;

}


/* ==================================================
   MAIN
================================================== */

.main {

  flex: 1;

  display: grid;

  grid-template-columns:
    42% 58%;

  min-height: 0;

}


/* ==================================================
   LEFT AVATAR AREA
================================================== */

.avatar-section {

  position: relative;

  overflow: hidden;

  display: flex;

  justify-content: center;

}


/* garis tengah */

.avatar-section::after {

  content: "";

  position: absolute;

  right: 0;

  top: 0;

  width: 1px;

  height: 100%;

  background:
    rgba(255,255,255,.08);

}


/* ==================================================
   AVATAR TRACK
================================================== */

.avatar-track {

  position: absolute;

  top: 40px;

  left: 0;

  width: 100%;

  display: flex;

  justify-content: center;

  transition:
    transform .8s cubic-bezier(.2,.8,.2,1);

}


/*
Avatar akan bergerak turun
setiap kali percakapan bertambah.
*/

.avatar-track.move-1 {
  transform: translateY(45px);
}

.avatar-track.move-2 {
  transform: translateY(90px);
}

.avatar-track.move-3 {
  transform: translateY(135px);
}

.avatar-track.move-4 {
  transform: translateY(180px);
}

.avatar-track.move-5 {
  transform: translateY(225px);
}


/* ==================================================
   AVATAR
================================================== */

.avatar-wrapper {

  width: 330px;

  height: 330px;

  border-radius: 50%;

  display: flex;

  justify-content: center;

  align-items: center;

  background:
    radial-gradient(
      circle,
      #60a5fa,
      #2563eb 50%,
      #1e40af
    );

  box-shadow:
    0 0 50px
    rgba(37,99,235,.5);

  transition:
    transform .3s,
    box-shadow .3s;

}


/* mendengarkan */

.avatar-wrapper.listening {

  animation:
    listening 1s infinite;

}


/* berbicara */

.avatar-wrapper.speaking {

  animation:
    talking .45s infinite alternate;

}


/* ==================================================
   SVG
================================================== */

.avatar {

  width: 255px;

  height: 255px;

}


/* mulut */

.mouth {

  transform-origin:
    150px 195px;

}


/* animasi mulut */

.speaking .mouth {

  animation:
    mouthMove .22s infinite alternate;

}


/* ==================================================
   INFO
================================================== */

.avatar-info {

  position: absolute;

  top: 390px;

  width: 100%;

  text-align: center;

  transition:
    top .8s;

}

.avatar-name {

  font-size: 24px;

  font-weight: bold;

}

.avatar-role {

  margin-top: 6px;

  color: #94a3b8;

  font-size: 14px;

}


/* ==================================================
   RIGHT CHAT
================================================== */

.chat-section {

  display: flex;

  flex-direction: column;

  min-height: 0;

  background:
    rgba(15,23,42,.65);

}


/* ==================================================
   CHAT HEADER
================================================== */

.chat-header {

  padding: 22px 28px;

  border-bottom:
    1px solid rgba(255,255,255,.08);

}

.chat-header h2 {

  margin: 0;

  font-size: 20px;

}

.chat-header p {

  margin: 5px 0 0;

  color: #94a3b8;

  font-size: 13px;

}


/* ==================================================
   CHAT MESSAGES
================================================== */

#chat {

  flex: 1;

  overflow-y: auto;

  padding: 25px;

  scroll-behavior: smooth;

}


/* scrollbar */

#chat::-webkit-scrollbar {

  width: 7px;

}

#chat::-webkit-scrollbar-thumb {

  background: #475569;

  border-radius: 10px;

}


/* ==================================================
   MESSAGE
================================================== */

.message {

  max-width: 75%;

  padding: 14px 18px;

  margin-bottom: 18px;

  border-radius: 18px;

  line-height: 1.55;

  white-space: pre-line;

  animation:
    messageIn .35s ease;

}


/* bot */

.bot {

  background: #334155;

  border-bottom-left-radius: 5px;

}


/* user */

.user {

  margin-left: auto;

  background: #2563eb;

  border-bottom-right-radius: 5px;

}


/* ==================================================
   INPUT
================================================== */

.bottom {

  padding: 15px 25px 20px;

  border-top:
    1px solid rgba(255,255,255,.08);

}


/* input */

.input-area {

  display: flex;

  gap: 10px;

}

#textInput {

  flex: 1;

  padding: 15px;

  border: none;

  outline: none;

  border-radius: 14px;

  background: #334155;

  color: white;

  font-size: 14px;

}

#textInput::placeholder {

  color: #94a3b8;

}


/* send */

#send {

  border: none;

  padding: 0 22px;

  border-radius: 14px;

  background: #2563eb;

  color: white;

  cursor: pointer;

  font-weight: bold;

}


/* microphone */

.mic-row {

  text-align: center;

  margin-top: 12px;

}

#mic {

  width: 58px;

  height: 58px;

  border: none;

  border-radius: 50%;

  background: #2563eb;

  color: white;

  font-size: 25px;

  cursor: pointer;

}

#mic.active {

  background: #dc2626;

  animation:
    pulse 1s infinite;

}

#status {

  margin-top: 7px;

  text-align: center;

  font-size: 12px;

  color: #94a3b8;

}


/* ==================================================
   ANIMATION
================================================== */

@keyframes listening {

  0% {

    box-shadow:
      0 0 25px #3b82f6;

  }

  50% {

    box-shadow:
      0 0 80px #60a5fa;

  }

  100% {

    box-shadow:
      0 0 25px #3b82f6;

  }

}


@keyframes talking {

  from {

    transform:
      scale(1);

  }

  to {

    transform:
      scale(1.035);

  }

}


@keyframes mouthMove {

  from {

    transform:
      scaleY(1);

  }

  to {

    transform:
      scaleY(.25);

  }

}


@keyframes pulse {

  0% {

    box-shadow:
      0 0 0 0
      rgba(220,38,38,.6);

  }

  70% {

    box-shadow:
      0 0 0 18px
      rgba(220,38,38,0);

  }

  100% {

    box-shadow:
      0 0 0 0
      rgba(220,38,38,0);

  }

}


@keyframes messageIn {

  from {

    opacity: 0;

    transform:
      translateY(15px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


/* ==================================================
   MOBILE
================================================== */

@media(max-width: 900px) {

  body {

    overflow: auto;

  }

  .main {

    grid-template-columns: 1fr;

    height: auto;

  }

  .avatar-section {

    height: 430px;

  }

  .avatar-wrapper {

    width: 250px;

    height: 250px;

  }

  .avatar {

    width: 195px;

    height: 195px;

  }

  .avatar-info {

    top: 300px;

  }

  .chat-section {

    height: 600px;

  }

}

</style>
</head>


<body>


<div class="app">


<!-- ==================================================
     HEADER
================================================== -->

<header class="header">

  <div class="logo">
    🤖 AI Customer Service
  </div>

  <div class="status-online">

    <span class="online-dot"></span>

    Sarah Online

  </div>

</header>



<!-- ==================================================
     MAIN
================================================== -->

<main class="main">


<!-- ==================================================
     AVATAR
================================================== -->

<section class="avatar-section">


  <div
    id="avatarTrack"
    class="avatar-track"
  >

    <div
      id="avatarWrapper"
      class="avatar-wrapper"
    >


      <!-- AVATAR -->

      <svg
        class="avatar"
        viewBox="0 0 300 300"
        xmlns="http://www.w3.org/2000/svg"
      >

        <!-- rambut -->

        <path
          d="
          M70 130
          C65 60 105 25 150 25
          C205 25 235 70 230 135
          L210 115
          C205 70 180 55 150 55
          C115 55 90 80 85 120
          Z"
          fill="#3b2416"
        />


        <!-- wajah -->

        <ellipse
          cx="150"
          cy="145"
          rx="78"
          ry="90"
          fill="#f4c7a1"
        />


        <!-- rambut depan -->

        <path
          d="
          M75 115
          C70 55 110 35 150 35
          C195 35 225 70 220 115
          C195 85 180 75 160 80
          C135 90 105 75 75 115
          Z"
          fill="#432818"
        />


        <!-- mata -->

        <ellipse
          cx="120"
          cy="145"
          rx="8"
          ry="10"
          fill="#1e293b"
        />

        <ellipse
          cx="180"
          cy="145"
          rx="8"
          ry="10"
          fill="#1e293b"
        />


        <!-- hidung -->

        <path
          d="
          M150 150
          L143 170
          L155 170"
          fill="none"
          stroke="#c08457"
          stroke-width="4"
        />


        <!-- mulut -->

        <ellipse
          id="mouth"
          class="mouth"
          cx="150"
          cy="195"
          rx="22"
          ry="7"
          fill="#7f1d1d"
        />


        <!-- baju -->

        <path
          d="
          M90 235
          C110 215 190 215 210 235
          L235 300
          L65 300
          Z"
          fill="#2563eb"
        />


        <!-- kerah -->

        <path
          d="
          M120 230
          L150 265
          L180 230
          Z"
          fill="white"
        />

      </svg>

    </div>

  </div>


  <div
    id="avatarInfo"
    class="avatar-info"
  >

    <div class="avatar-name">
      Sarah
    </div>

    <div
      id="avatarStatus"
      class="avatar-role"
    >
      Customer Service
    </div>

  </div>


</section>



<!-- ==================================================
     CHAT
================================================== -->

<section class="chat-section">


  <div class="chat-header">

    <h2>
      Percakapan
    </h2>

    <p>
      Berbicara langsung dengan Sarah
    </p>

  </div>


  <div id="chat">

    <div class="message bot">

      Halo 👋 Saya Sarah,
      Customer Service Anda.

      Silakan tanyakan tentang
      produk, harga, alamat,
      pengiriman, atau layanan kami.

    </div>

  </div>


  <div class="bottom">


    <div class="input-area">

      <input
        id="textInput"
        type="text"
        placeholder="Tulis pesan..."
      >

      <button id="send">
        Kirim
      </button>

    </div>


    <div class="mic-row">

      <button id="mic">
        🎤
      </button>

      <div id="status">
        Tekan mikrofon untuk berbicara
      </div>

    </div>

  </div>


</section>


</main>

</div>



<script>


/* ==================================================
   DATA CUSTOMER SERVICE
================================================== */

const DATA = {

  perusahaan: {

    nama: "Toko ABC",

    alamat:
      "Jl. Contoh No. 123, Denpasar, Bali",

    telepon:
      "08123456789",

    email:
      "customer@tokoabc.com",

    jam:
      "Senin sampai Sabtu, pukul 08.00 sampai 17.00"

  },


  produk: [

    {
      nama: "Produk A",

      harga: "Rp100.000",

      deskripsi:
        "Produk berkualitas untuk kebutuhan sehari-hari.",

      stok:
        "Tersedia"

    },

    {
      nama: "Produk B",

      harga: "Rp150.000",

      deskripsi:
        "Produk premium dengan kualitas terbaik.",

      stok:
        "Tersedia"

    },

    {
      nama: "Produk C",

      harga: "Rp200.000",

      deskripsi:
        "Produk pilihan untuk kebutuhan keluarga.",

      stok:
        "Habis"

    }

  ],


  faq: [

    {
      kata: ["cara", "pesan"],

      jawaban:
        "Untuk melakukan pemesanan, silakan pilih produk dan hubungi customer service kami."
    },

    {
      kata: ["cara", "bayar"],

      jawaban:
        "Kami menerima pembayaran melalui transfer bank dan pembayaran digital."
    },

    {
      kata: ["pengiriman"],

      jawaban:
        "Kami melayani pengiriman ke berbagai wilayah. Lama pengiriman tergantung lokasi tujuan."
    },

    {
      kata: ["refund"],

      jawaban:
        "Untuk pengajuan refund, silakan hubungi customer service kami."
    }

  ]

};



/* ==================================================
   ELEMENT
================================================== */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("textInput");

const send =
  document.getElementById("send");

const mic =
  document.getElementById("mic");

const status =
  document.getElementById("status");

const avatarTrack =
  document.getElementById("avatarTrack");

const avatarWrapper =
  document.getElementById("avatarWrapper");

const avatarStatus =
  document.getElementById("avatarStatus");


/*
Jumlah percakapan.
Digunakan untuk membuat avatar
bergerak turun mengikuti dialog.
*/

let conversationCount = 0;



/* ==================================================
   TAMBAH PESAN
================================================== */

function addMessage(text, type) {

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.innerText =
    text;

  chat.appendChild(div);


  /*
  Scroll otomatis ke pesan terbaru
  */

  chat.scrollTo({

    top: chat.scrollHeight,

    behavior: "smooth"

  });


  /*
  Avatar ikut bergerak turun.

  Setelah 5 langkah, posisinya
  kembali agar tidak keluar layar.
  */

  conversationCount++;


  const step =
    conversationCount % 6;


  avatarTrack.className =
    "avatar-track";


  if (step > 0) {

    avatarTrack.classList.add(
      "move-" + step
    );

  }

}



/* ==================================================
   JAWAB
================================================== */

function jawab(question) {

  const q =
    question.toLowerCase();


  /* salam */

  if (
    q.includes("halo") ||
    q.includes("hai") ||
    q.includes("hello")
  ) {

    return `Halo 👋 Selamat datang di ${DATA.perusahaan.nama}. Ada yang bisa saya bantu?`;

  }


  /* alamat */

  if (
    q.includes("alamat") ||
    q.includes("lokasi") ||
    q.includes("dimana") ||
    q.includes("di mana")
  ) {

    return `Alamat kami adalah ${DATA.perusahaan.alamat}.`;

  }


  /* telepon */

  if (
    q.includes("telepon") ||
    q.includes("nomor") ||
    q.includes("whatsapp") ||
    q.includes("wa")
  ) {

    return `Nomor customer service kami adalah ${DATA.perusahaan.telepon}.`;

  }


  /* email */

  if (
    q.includes("email")
  ) {

    return `Email kami adalah ${DATA.perusahaan.email}.`;

  }


  /* jam */

  if (
    q.includes("jam") ||
    q.includes("buka") ||
    q.includes("tutup") ||
    q.includes("operasional")
  ) {

    return `Jam operasional kami adalah ${DATA.perusahaan.jam}.`;

  }


  /* produk */

  for (
    const produk of DATA.produk
  ) {

    const nama =
      produk.nama.toLowerCase();


    if (
      q.includes(nama)
    ) {


      if (
        q.includes("harga") ||
        q.includes("berapa")
      ) {

        return `${produk.nama} harganya ${produk.harga}.`;

      }


      if (
        q.includes("stok") ||
        q.includes("ada") ||
        q.includes("tersedia")
      ) {

        return `Untuk ${produk.nama}, stok saat ini ${produk.stok}.`;

      }


      return `
${produk.nama}

${produk.deskripsi}

Harga: ${produk.harga}

Stok: ${produk.stok}
`;

    }

  }


  /* semua harga */

  if (
    q.includes("harga") ||
    q.includes("berapa")
  ) {

    let result =
      "Berikut daftar harga produk kami:\n\n";


    DATA.produk.forEach(
      p => {

        result +=
          `${p.nama}: ${p.harga}\n`;

      }
    );


    return result;

  }


  /* FAQ */

  for (
    const faq of DATA.faq
  ) {

    let cocok =
      0;


    faq.kata.forEach(
      kata => {

        if (
          q.includes(kata)
        ) {

          cocok++;

        }

      }
    );


    if (
      cocok >=
      Math.ceil(
        faq.kata.length / 2
      )
    ) {

      return faq.jawaban;

    }

  }


  /* terima kasih */

  if (
    q.includes("terima kasih") ||
    q.includes("makasih")
  ) {

    return "Sama-sama 😊 Senang bisa membantu Anda.";

  }


  /* default */

  return `
Maaf, saya belum menemukan informasi tersebut.

Anda dapat menanyakan:

• Harga produk
• Stok produk
• Alamat
• Jam operasional
• Nomor telepon
• Email
• Cara pemesanan
• Pembayaran
• Pengiriman
• Refund
`;

}



/* ==================================================
   PROSES
================================================== */

function proses(text) {

  if (
    !text.trim()
  ) {

    return;

  }


  addMessage(
    text,
    "user"
  );


  status.innerText =
    "Sarah sedang berpikir...";


  avatarStatus.innerText =
    "Sedang menjawab...";


  setTimeout(
    () => {

      const answer =
        jawab(text);


      addMessage(
        answer,
        "bot"
      );


      speak(answer);

    },
    500
  );

}



/* ==================================================
   KIRIM TEXT
================================================== */

send.onclick =
  () => {

    const text =
      input.value;


    input.value =
      "";


    proses(text);

  };


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      send.click();

    }

  }
);



/* ==================================================
   VOICE RECOGNITION
================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (
  SpeechRecognition
) {

  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "id-ID";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  mic.onclick =
    () => {

      try {

        recognition.start();


        mic.classList.add(
          "active"
        );


        mic.innerHTML =
          "🔴";


        status.innerText =
          "Mendengarkan...";


        avatarStatus.innerText =
          "Sarah sedang mendengarkan...";


        avatarWrapper.classList.add(
          "listening"
        );

      }

      catch(error) {

        console.log(error);

      }

    };


  recognition.onresult =
    event => {

      const text =
        event.results[0][0].transcript;


      mic.classList.remove(
        "active"
      );


      mic.innerHTML =
        "🎤";


      avatarWrapper.classList.remove(
        "listening"
      );


      proses(text);

    };


  recognition.onend =
    () => {

      mic.classList.remove(
        "active"
      );


      mic.innerHTML =
        "🎤";


      avatarWrapper.classList.remove(
        "listening"
      );

    };


  recognition.onerror =
    event => {

      console.log(
        event.error
      );


      mic.classList.remove(
        "active"
      );


      mic.innerHTML =
        "🎤";


      avatarWrapper.classList.remove(
        "listening"
      );


      status.innerText =
        "Silakan coba lagi.";


      avatarStatus.innerText =
        "Siap membantu Anda";

    };

}



/* ==================================================
   TEXT TO SPEECH
================================================== */

function speak(text) {

  speechSynthesis.cancel();


  const voice =
    new SpeechSynthesisUtterance(
      text
    );


  voice.lang =
    "id-ID";


  voice.rate =
    .95;


  voice.pitch =
    1;


  avatarWrapper.classList.add(
    "speaking"
  );


  avatarStatus.innerText =
    "Sarah sedang berbicara...";


  voice.onend =
    () => {

      avatarWrapper.classList.remove(
        "speaking"
      );


      avatarStatus.innerText =
        "Customer Service";

      status.innerText =
        "Tekan mikrofon untuk berbicara lagi";

    };


  speechSynthesis.speak(
    voice
  );

}

</script>

</body>
</html>
